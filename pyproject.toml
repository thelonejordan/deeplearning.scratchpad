[project]
name = "deeplearning-scratchpad"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    # keep in sync with RUNPOD_IMAGE in .github/workflows/test-gpu.yml: GPU CI runs against the
    # torch preinstalled in that image, so pinning here keeps CPU and GPU CI on the same version
    "torch==2.13.0",
    "torchvision==0.28.0",
    "huggingface-hub[hf_xet]",
    "transformers[torch]",
    "tiktoken",
    "sentencepiece",
    "blobfile",
    "requests",
    "gradio>=6.10.0",
    "protobuf>=7.34.1",
    "hf-transfer>=0.1.9",
]

[dependency-groups]
dev = [
    "notebook",
    "ipywidgets",
    "ruff",
    "pytest",
    "mypy",
]
runpod = [
    "runpod",
    "paramiko",
]
